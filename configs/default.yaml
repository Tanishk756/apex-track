# APEX-Track — Default Configuration
# All values here are the baseline; hardware profiles override specific keys.
# User config files and APEX_* env vars override on top of that.

version: "1.0"

logging:
  level: INFO
  format: console
  file: null

hardware:
  force_cpu: false
  cuda_device: 0
  tensorrt_workspace_mb: 1024
  accept_agpl_plugins: false
  pinned_memory: true
  cuda_streams: 2

detector:
  plugin: rtdetr               # High-precision neural detector
  model_name: yolov8x.pt
  use_real_ai: true
  confidence_threshold: 0.15

  nms_iou_threshold: 0.45
  max_detections: 300
  input_size: [640, 640]
  fp_precision: fp16
  class_filter: []

tracker:
  plugin: bytetrack
  min_hits: 1
  max_misses: 90
  iou_threshold: 0.25
  track_high_thresh: 0.20
  track_low_thresh: 0.10
  match_thresh: 0.70
  reid_enabled: true


scheduler:
  detect_every: 1
  min_detect_every: 1
  max_detect_every: 10
  gpu_load_high_pct: 80.0
  confidence_low_thresh: 0.4
  optical_flow_trigger: true

telemetry:
  enabled: true
  plugin: mavlink_udp
  connection: "udp:0.0.0.0:14550"
  timeout_s: 5.0
  reconnect_interval_s: 3.0
  source_system: 255
  source_component: 0

camera_manager:
  cameras:
    - plugin: usb_camera
      source: "0"
      width: 1280
      height: 720
      fps: 30.0
      buffer_size: 1
      hw_decode: true
      reconnect_on_failure: true
  sync_tolerance_ms: 50.0

recording:
  enabled: false
  output_dir: recordings
  format: mp4
  codec: h264
  fps: 30.0
  record_raw: true
  record_hud: true
  record_ros_bag: false
  record_telemetry: true
  telemetry_format: both

mission:
  profile: road_vehicles
  auto_lock: true
  lock_mode: AUTO
  reacquisition_enabled: true
  coast_max_frames: 30

api:
  rest_enabled: true
  rest_host: "0.0.0.0"
  rest_port: 8000
  ws_enabled: true
  ws_port: 8001
  ws_publish_rate_hz: 10.0
  cors_origins: ["*"]

diagnostics:
  health_interval_s: 1.0
  metrics_interval_s: 0.5
  gpu_warn_pct: 85.0
  cpu_warn_pct: 90.0
  ram_warn_pct: 85.0

roboflow:
  api_key: ""
  default_model: "uav-detection/3"
  enabled: true

openai:
  api_key: ""
  model: "gpt-4o-mini"
  enabled: true

weather:
  api_key: ""
  enabled: true
  update_interval_s: 60



