name: drone_tracking
description: "Counter-UAS aerial drone detection and high-speed pursuit profile"
detector_plugin: rtdetr
tracker_plugin: bytetrack
confidence_threshold: 0.25
nms_threshold: 0.40
target_classes: ["drone", "uav", "quadcopter", "airplane", "kite", "bird"]
use_ensemble: false
gimbal_lead_targeting: true
speed_mode_kmh: 120
